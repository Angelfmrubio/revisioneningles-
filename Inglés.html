<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEURONA 7 - Revisor Synthetics</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         font-size:18px; line-height:1.6; background:#0a0a0a; color:#e8e8e8; 
         background-image: radial-gradient(ellipse at top, #1a1a1a 0%, #0a0a0a 100%); min-height:100vh; }
  header { background:linear-gradient(180deg, #0a2540 0%, #061a2e 100%); color:#ffd700; 
           padding:22px 16px; text-align:center; position:sticky; top:0; z-index:10;
           border-bottom:2px solid #ffd700; box-shadow:0 4px 20px rgba(255,215,0,.15); }
  header h1 { margin:0; font-size:1.35rem; font-weight:800; letter-spacing:1px; }
  header p { margin:6px 0 0; font-size:.9rem; color:#fff; opacity:.85; }
  main { padding:16px; max-width:800px; margin:0 auto; }
  textarea { width:100%; min-height:240px; padding:16px; font-size:18px; font-family:inherit;
             border:2px solid #333; border-radius:16px; background:#111; color:#fff; resize:vertical;
             box-shadow: inset 0 2px 10px rgba(0,0,0,.5); }
  textarea:focus { outline:none; border-color:#ffd700; box-shadow:0 0 0 3px rgba(255,215,0,.2); }
  .row { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
  button { flex:1; min-width:140px; min-height:62px; font-size:1.05rem; font-weight:700;
           border:none; border-radius:14px; cursor:pointer; padding:12px 16px; transition:.15s; }
  button:active { transform:scale(.97); }
  button.primary { background:linear-gradient(180deg, #ffd700, #b89600); color:#000; box-shadow:0 4px 15px rgba(255,215,0,.3); }
  button.secondary { background:#1e1e1e; color:#ffd700; border:1px solid #333; }
  button.listen { background:#0a5a2a; color:#fff; border:1px solid #1d7a3a; }
  .status { padding:14px; background:linear-gradient(135deg, #0a2540, #123a66); border:1px solid #ffd700; 
            border-radius:14px; font-size:1rem; margin:12px 0; text-align:center; display:none; color:#ffd700; }
  details { background:#161616; border:1px solid #2a2a2a; border-radius:16px; margin:14px 0; overflow:hidden; }
  details summary { padding:18px 16px; font-weight:700; font-size:1.05rem; cursor:pointer; color:#ffd700;
                    display:flex; justify-content:space-between; align-items:center; }
  details .body { padding:0 16px 18px; font-size:1rem; color:#ccc; }
  ul.plain { list-style:none; padding:0; margin:0; }
  ul.plain li { padding:12px 0; border-bottom:1px solid #222; }
  .metric-row { display:flex; gap:10px; margin:12px 0; flex-wrap:wrap; }
  .metric { flex:1; min-width:100px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:12px;
            padding:14px 8px; text-align:center; }
  .metric .v { font-size:1.5rem; font-weight:800; color:#ffd700; }
  .metric .l { font-size:.8rem; opacity:.7; color:#fff; }
  .tag-warn { color:#ff6b35; font-weight:700; }
  .tag-ok { color:#34c759; font-weight:700; }
  .empty { color:#8e8e93; font-style:italic; }
</style>
</head>
<body>
<header>
  <h1>🧠 NEURONA 7 - Revisor</h1>
  <p>Dicta · Revisa · Escucha - El Capitolio Tricerebral</p>
</header>
<main>
  <textarea id="text" placeholder="Pega aquí tu capítulo en inglés del libro NEURONA 7, o dicta con el micrófono..."></textarea>
  <div class="row">
    <button class="secondary" id="dictBtn">🎤 Dictar EN</button>
    <button class="secondary" id="clearBtn">🧹 Limpiar</button>
  </div>
  <div class="row">
    <button class="primary" id="checkBtn">🔍 Revisar Capítulo</button>
  </div>
  <div class="row">
    <button class="listen" id="listenBtn">🔊 Escuchar Diagnóstico</button>
  </div>
  <div id="status" class="status"></div>
  <div id="results"></div>
</main>
<script>
const TERMS = {
  "entropy of being": ["being's entropy","entropy of the being"],
  "chronopathy": ["chronopatía","chronopaty","chronophaty"],
  "liquid connections": ["liquid connection","connections liquid"],
  "zombie algorithms": ["zombies algorithms","algorithm zombies"],
  "disruptive elite": ["elite disruptiva","disruptive elites"],
  "negentropy": ["negative entropy","negentropia"],
  "language of silence": ["silence language","language of the silence"],
  "harmony of the imperfect": ["harmony of imperfect","imperfect harmony"],
  "reactions taster": ["catador de reacciones","reaction taster"],
  "hydration of the soul": ["soul hydration","hydratation of the soul"],
  "wabi-sabi": ["wabisabi"], "ikigai": ["ikigay","ikigaii"], "half-lives": ["half lives","halflives"]
};
const CALQUES = {
  "it is inevitable to elude":"it is impossible to avoid", "to assemble with origins":"to reconnect with origins",
  "the core issue is":"the main issue is", "in order to":"to", "due to the fact that":"because",
  "it is important to note that":"(delete)", "at the end of the day":"(cliché)", "each time more":"increasingly",
  "the same that":"the same as", "depends of":"depends on", "consists in":"consists of",
  "in base to":"based on", "with base in":"based on", "it is for that":"that is why", "for the contrary":"on the contrary"
};
const $ = id => document.getElementById(id);
const splitSent = t => t.split(/(?<=[.!?])\s+/).filter(s => s.trim());
function syl(w){
  w = w.toLowerCase().replace(/[^a-z]/g,''); if(!w) return 0; if(w.length<=3) return 1;
  w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');
  const m = w.match(/[aeiouy]{1,2}/g); return m ? m.length : 1;
}
function flesch(t){
  const ss = splitSent(t).length || 1; const ws = t.split(/\s+/).filter(w => w); const n = ws.length || 1;
  let sy = 0; for(const w of ws) sy += syl(w); return 206.835 - 1.015*(n/ss) - 84.6*(sy/n);
}
function fkg(t){
  const ss = splitSent(t).length || 1; const ws = t.split(/\s+/).filter(w => w); const n = ws.length || 1;
  let sy = 0; for(const w of ws) sy += syl(w); return 0.39*(n/ss) + 11.8*(sy/n) - 15.59;
}
function checkTerms(t){
  const low = t.toLowerCase(), out = [];
  for(const [c,w] of Object.entries(TERMS)) for(const v of w) if(low.includes(v.toLowerCase())) out.push({c,w:v});
  return out;
}
function checkCalques(t){
  const low = t.toLowerCase(), out = [];
  for(const [k,v] of Object.entries(CALQUES)) if(low.includes(k)) out.push({k,v});
  return out;
}
function checkLong(t, max=30){
  return splitSent(t).map(s => ({n:s.split(/\s+/).length, s:s.trim()})).filter(o => o.n > max).sort((a,b) => b.n-a.n);
}
function checkRepeats(t){
  const stop = new Set("that this with from have been they their there which while where what when will would could should about after before between into over under more most some such only also than then them".split(" "));
  const ws = t.toLowerCase().match(/\b[a-z]{4,}\b/g) || []; const c = {};
  for(const w of ws) if(!stop.has(w)) c[w] = (c[w]||0)+1;
  return Object.entries(c).filter(([,n]) => n>=4).sort((a,b)=>b[1]-a[1]).slice(0,15);
}
function metricRow(vs){
  return `<div class="metric-row">${vs.map(v => `<div class="metric"><div class="v">${v.v}</div><div class="l">${v.l}</div></div>`).join("")}</div>`;
}
function box(title, count, html, okText){
  const status = count===0 ? '<span class="tag-ok">✓</span>' : `<span class="tag-warn">${count}</span>`;
  const body = count===0 ? `<p class="empty">${okText}</p>` : html;
  return `<details ${count>0?'open':''}><summary>${title} ${status}</summary><div class="body">${body}</div></details>`;
}
let lastSpeech = "";
function review(){
  const text = $("text").value.trim(); const res = $("results"), st = $("status");
  if(!text){ st.style.display="block"; st.textContent="Escribe o dicta un texto primero."; return; }
  localStorage.setItem('neurona7_draft', text);
  const words = text.split(/\s+/).filter(w => w).length; const sents = splitSent(text).length;
  const fre = flesch(text), fg = fkg(text); const terms = checkTerms(text); const cal = checkCalques(text);
  const long = checkLong(text); const rep = checkRepeats(text);
  let html = ""; 
  html += `<details open><summary>📊 Métricas NEURONA 7</summary><div class="body">
    ${metricRow([{v:words,l:"Palabras"},{v:sents,l:"Oraciones"},{v:sents?(words/sents).toFixed(1):0,l:"Pal/Ora"}])}
    ${metricRow([{v:fre.toFixed(1),l:"Flesch"},{v:fg.toFixed(1),l:"Grado"}])}
  </div></details>`;
  html += terms.length===0 ? box("🧩 Términos clave", 0, "", "Términos consistentes.") 
    : box("🧩 Términos clave", terms.length, `<ul class="plain">${terms.map(t=>`<li>Usa <strong>${t.c}</strong> en lugar de <em>${t.w}</em></li>`).join("")}</ul>`, "");
  html += cal.length===0 ? box("🔁 Calcos ES→EN", 0, "", "Sin calcos detectados.")
    : box("🔁 Calcos ES→EN", cal.length, `<ul class="plain">${cal.map(c=>`<li>«${c.k}» → <strong>${c.v}</strong></li>`).join("")}</ul>`, "");
  html += long.length===0 ? box("📏 Oraciones largas", 0, "", "Todas dentro del límite (30).")
    : box("📏 Oraciones largas", long.length, `<ul class="plain">${long.map(o=>`<li><strong>${o.n} palabras:</strong> ${o.s.slice(0,200)}${o.s.length>200?"…":""}</li>`).join("")}</ul>`, "");
  html += rep.length===0 ? box("🔂 Repeticiones", 0, "", "Sin repeticiones llamativas.")
    : box("🔂 Repeticiones", rep.length, `<ul class="plain">${rep.map(([w,n])=>`<li><strong>${w}</strong>: ${n} veces</li>`).join("")}</ul>`, "");
  res.innerHTML = html;
  let speech = `Métricas: ${words} palabras, ${sents} oraciones. Flesch ${fre.toFixed(1)}. Grado ${fg.toFixed(1)}. `;
  speech += terms.length ? `Términos inconsistentes: ${terms.length}. ` : "Términos consistentes. ";
  speech += cal.length ? `Calcos: ${cal.length}. ` : "Sin calcos. ";
  speech += long.length ? `Oraciones largas: ${long.length}. ` : "Sin oraciones largas. ";
  lastSpeech = speech; st.style.display="block"; st.textContent="✅ Revisión completada - Borrador guardado.";
}
function speak(){
  if(!lastSpeech){ alert("Primero pulsa Revisar."); return; }
  if(!("speechSynthesis" in window)){ alert("No soporta voz."); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(lastSpeech); u.lang = "es-ES"; u.rate = 0.95;
  window.speechSynthesis.speak(u);
}
function dictar(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Dictado no soportado, pega texto."); return; }
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false; rec.continuous = false;
  rec.onresult = e => {
    const t = e.results[0][0].transcript; $("text").value += ( $("text").value ? " " : "" ) + t;
    $("status").style.display="block"; $("status").textContent="Texto dictado añadido.";
  };
  rec.onerror = e => { $("status").style.display="block"; $("status").textContent="Error dictado: " + e.error; };
  rec.start();
}
$("checkBtn").addEventListener("click", review);
$("listenBtn").addEventListener("click", speak);
$("dictBtn").addEventListener("click", dictar);
$("clearBtn").addEventListener("click", () => {
  if(confirm("¿Borrar todo?")){ $("text").value = ""; $("results").innerHTML = ""; $("status").style.display = "none"; localStorage
