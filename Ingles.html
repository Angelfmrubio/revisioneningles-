<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SINTÉTICOS - Revisor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;font-size:18px;background:#121212;color:#e0e0e0;padding:16px}
h1{color:#ffd700;text-align:center;font-size:1.3rem}
textarea{width:100%;min-height:200px;padding:14px;font-size:16px;border-radius:10px;background:#1e1e1e;color:#fff;border:2px solid #333;margin-bottom:12px}
input[type=file]{width:100%;padding:16px;background:#6a1b9a;color:#fff;border-radius:10px;font-size:16px;font-weight:bold;margin-bottom:12px;border:none}
button{width:100%;padding:16px;font-size:18px;font-weight:bold;color:#000;background:#ffd700;border:none;border-radius:10px;cursor:pointer;margin-bottom:12px}
.status{text-align:center;color:#ffd700;margin-bottom:12px}
#results details{background:#1e1e1e;margin-bottom:10px;border-radius:10px;padding:10px;border:1px solid #333}
#results summary{color:#ffd700;font-weight:bold;cursor:pointer}
ul{padding-left:20px;margin:10px 0;font-size:14px}
</style>
</head>
<body>

<h1>📖 SINTÉTICOS - Revisor KDP</h1>

<!-- EL BOTÓN NATIVO QUE SÍ FUNCIONA -->
<input type="file" id="fileInput" accept=".epub,.txt">

<div class="status" id="status">Sube tu archivo ePub</div>

<textarea id="text" placeholder="El texto aparecerá aquí..."></textarea>

<button onclick="revisar()">🔍 Revisar Texto Completo</button>

<div id="results"></div>

<script>
const $ = id => document.getElementById(id);

// LÓGICA PARA ABRIR EL EPUB (La misma que te funcionó)
$("fileInput").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    
    $("status").textContent = "Extrayendo texto... espera.";
    
    if (f.name.toLowerCase().endsWith(".epub")) {
        try {
            const zip = await JSZip.loadAsync(f);
            let fullText = "";
            const promises = [];
            
            zip.forEach((path, entry) => {
                if (!entry.dir && (path.endsWith(".html") || path.endsWith(".xhtml") || path.endsWith(".htm"))) {
                    promises.push(entry.async("string").then(content => {
                        const doc = new DOMParser().parseFromString(content, "text/html");
                        fullText += (doc.body.textContent || "") + "\n\n";
                    }));
                }
            });
            
            await Promise.all(promises);
            $("text").value = fullText;
            $("status").textContent = "✅ ¡Libro cargado con éxito!";
            
        } catch (error) {
            $("status").textContent = "Error al abrir el ePub.";
        }
    } else {
        // Para archivos de texto normal
        const reader = new FileReader();
        reader.onload = ev => {
            $("text").value = ev.target.result;
            $("status").textContent = "✅ Texto cargado.";
        };
        reader.readAsText(f);
    }
});

// LÓGICA DE REVISIÓN (La que te dio el reporte)
function revisar() {
    const text = $("text").value.trim();
    if (!text) {
        $("status").textContent = "Primero sube un archivo.";
        return;
    }
    
    const words = text.split(/\s+/).filter(w => w).length;
    
    // Aquí van tus diccionarios de términos y calcos
    const TERMS = {"entropy of being":["being's entropy"],"chronopathy":["chronopaty"],"liquid connections":["liquid connection"],"zombie algorithms":["zombies algorithms"],"disruptive elite":["elite disruptiva"],"negentropy":["negative entropy"],"language of silence":["silence language"],"harmony of the imperfect":["harmony of imperfect"],"reactions taster":["catador de reacciones"],"hydration of the soul":["soul hydration"]};
    const CALQUES = {"it is inevitable to elude":"it is impossible to avoid","in order to":"to","due to the fact that":"because","at the end of the day":"(cliché)","each time more":"increasingly","depends of":"depends on","in base to":"based on"};

    let html = `<details open><summary>📊 Resumen</summary><ul><li><b>Palabras:</b> ${words}</li></ul></details>`;
    
    // Términos
    let termHits = [];
    const low = text.toLowerCase();
    for(const [correct, wrongs] of Object.entries(TERMS)) {
        for(const w of wrongs) {
            if(low.includes(w)) termHits.push(`Usa <b>${correct}</b> en lugar de ${w}`);
        }
    }
    html += `<details><summary>🧩 Términos (${termHits.length})</summary><ul>${termHits.map(t=>`<li>${t}</li>`).join("")}</ul></details>`;

    // Calcos
    let calqueHits = [];
    for(const [k, v] of Object.entries(CALQUES)) {
        if(low.includes(k)) calqueHits.push(`«${k}» → <b>${v}</b>`);
    }
    html += `<details><summary>🔁 Calcos (${calqueHits.length})</summary><ul>${calqueHits.map(c=>`<li>${c}</li>`).join("")}</ul></details>`;

    $("results").innerHTML = html;
    $("status").textContent = "✅ Revisión completada.";
}
</script>

</body>
</html>
