<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SINTÉTICOS - Traductor KDP</title>
<!-- Solo librería para Word -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:18px;background:#121212;color:#e0e0e0;padding:16px}
h1{color:#ffd700;text-align:center;font-size:1.3rem}
label{display:block;margin:15px 0 5px;color:#ffd700;font-weight:bold}
textarea{width:100%;min-height:180px;padding:14px;font-size:16px;border-radius:12px;background:#1e1e1e;color:#fff;border:2px solid #333;margin-bottom:12px;line-height:1.5}
button{width:100%;padding:18px;font-size:1.1rem;font-weight:bold;color:#000;background:#ffd700;border:none;border-radius:12px;cursor:pointer;margin-bottom:12px}
button:active{transform:scale(0.98)}
button.translate{background:#2a5bd7;color:#fff}
.status{text-align:center;color:#ffd700;margin-bottom:15px;font-weight:bold}
/* ESTO HACE QUE EL BOTÓN DE SUBIR FUNCIONE SI O SÍ */
.btn-subir {
    display: block;
    width: 100%;
    padding: 20px;
    background: #6a1b9a;
    color: #fff;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 20px;
    border: 2px dashed #ffd700;
    text-align: center;
    cursor: pointer;
}
</style>
</head>
<body>

<h1>📖 SINTÉTICOS - Word a Inglés</h1>

<!-- EL TRUCO DEFINITIVO: Label que envuelve al Input -->
<label class="btn-subir">
    📁 SUBIR ARCHIVO WORD (.docx)
    <input type="file" id="fileInput" accept=".docx" style="display:none;">
</label>

<div class="status" id="status">Esperando tu Word...</div>

<label>🇪🇸 Texto en Español</label>
<textarea id="textEs" placeholder="El texto del Word aparecerá aquí..."></textarea>

<button class="translate" onclick="traducir()">🔄 Traducir al Inglés</button>

<label>🇺🇸 Texto en Inglés (Para Amazon)</label>
<textarea id="textEn" placeholder="La traducción aparecerá aquí..."></textarea>

<script>
const $ = id => document.getElementById(id);

// LEER EL ARCHIVO WORD
$("fileInput").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    
    $("status").textContent = "Leyendo Word... espera.";
    
    try {
        const arrayBuffer = await f.arrayBuffer();
        const result = await mammoth.extractRawText({arrayBuffer: arrayBuffer});
        $("textEs").value = result.value;
        $("status").textContent = "✅ Word cargado. Ahora dale a Traducir.";
    } catch (error) {
        $("status").textContent = "❌ Error al leer el archivo.";
    }
});

// TRADUCIR CON LA API
async function traducir() {
    const es = $("textEs").value.trim();
    if (!es) {
        $("status").textContent = "Primero sube tu archivo.";
        return;
    }

    $("status").textContent = "Traduciendo... no cierres la pantalla.";
    const enField = $("textEn");
    enField.value = ""; 

    try {
        const paras = es.split(/\n+/);
        let out = "";
        
        for (let i = 0; i < paras.length; i++) {
            let p = paras[i].trim();
            if (!p) continue;
            
            $("status").textContent = `Traduciendo ${i+1} de ${paras.length}...`;
            
            // Cortar en trozos seguros
            let chunk = p.slice(0, 450);
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=es|en`;
            
            const r = await fetch(url);
            const j = await r.json();
            
            if (j.responseData && j.responseData.translatedText) {
                out += j.responseData.translatedText + "\n\n";
            } else {
                out += p + "\n\n"; 
            }
            
            await new Promise(r => setTimeout(r, 300));
        }
        
        enField.value = out;
        $("status").textContent = "✅ Traducción lista.";
        
    } catch (e) {
        $("status").textContent = "❌ Error de internet.";
    }
}
</script>

</body>
</html>
