<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SINTÉTICOS - Traductor Sin Límite</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:18px;background:#121212;color:#e0e0e0;padding:16px}
h1{color:#ffd700;text-align:center;font-size:1.4rem;margin:10px 0}
p.subtitle{text-align:center;color:#888;font-size:0.9rem;margin-bottom:15px}
label{display:block;margin:15px 0 5px;color:#ffd700;font-weight:bold}
textarea{width:100%;min-height:220px;padding:14px;font-size:16px;border-radius:12px;background:#1e1e1e;color:#fff;border:2px solid #333;margin-bottom:12px;line-height:1.5}
button{width:100%;padding:18px;font-size:1.1rem;font-weight:bold;border:none;border-radius:12px;cursor:pointer;margin-bottom:12px}
button.translate{background:#2a5bd7;color:#fff}
button.save{background:#0284c7;color:#fff;font-size:1.2rem;margin-top:10px}
.status{text-align:center;color:#00ffea;margin-bottom:15px;font-weight:bold;min-height:20px}
input[type="file"]{display:block;width:100%;padding:20px;background:#6a1b9a;color:#fff;border-radius:12px;font-weight:bold;margin-bottom:20px;border:2px dashed #ffd700;text-align:center;cursor:pointer}
</style>
</head>
<body>

<h1>📖 SINTÉTICOS - Traductor</h1>
<p class="subtitle">Versión corregida - Sin límite diario - Guardado automático</p>

<label>1. Sube tu archivo (Word, PDF, ePub o TXT)</label>
<input type="file" id="fileInput" accept=".docx,.pdf,.epub,.txt,.html">

<div class="status" id="status">Esperando archivo...</div>

<label>2. Texto Original (Español)</label>
<textarea id="textEs" placeholder="Tu texto aparecerá aquí..."></textarea>

<button class="translate" onclick="traducir()">🔄 Traducir al Inglés (Sin Límite)</button>

<label>3. Texto en Inglés (Traducido)</label>
<textarea id="textEn" placeholder="La traducción completa aparecerá aquí..."></textarea>

<button class="save" onclick="guardarAvance()">💾 GUARDAR AVANCE EN MI TELÉFONO</button>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = id => document.getElementById(id);

// RECUPERAR AVANCE
window.addEventListener('load', () => {
    const es = localStorage.getItem('sinteticos_es');
    const en = localStorage.getItem('sinteticos_en');
    if(es){ $("textEs").value = es; }
    if(en){ $("textEn").value = en; }
    if(es || en){ $("status").textContent = "✅ Progreso anterior recuperado: " + (es?es.length:0) + " caracteres"; }
});

$("textEs").addEventListener('input', () => localStorage.setItem('sinteticos_es', $("textEs").value));
$("textEn").addEventListener('input', () => localStorage.setItem('sinteticos_en', $("textEn").value));

function guardarAvance(){
    const es = $("textEs").value;
    const en = $("textEn").value;
    if(!es && !en){ alert("No hay texto para guardar"); return; }
    const contenido = "=== ESPAÑOL - 7 PISADAS UNA HUELLA ===\n" + es + "\n\n=== INGLÉS ===\n" + en + "\n\nGuardado: " + new Date().toLocaleString();
    const blob = new Blob([contenido], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Mi_Avance_Sinteticos_"+Date.now()+".txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    $("status").textContent = "✅ Archivo guardado en Descargas";
}

// LEER ARCHIVOS
$("fileInput").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if(!f) return;
    $("status").textContent = "Extrayendo texto...";
    const ext = f.name.split('.').pop().toLowerCase();
    try{
        if(ext==="docx"){
            const buf = await f.arrayBuffer();
            const res = await mammoth.extractRawText({arrayBuffer:buf});
            $("textEs").value = res.value;
            localStorage.setItem('sinteticos_es', res.value);
            $("status").textContent = "✅ Word cargado: " + res.value.length + " caracteres";
        } else if(ext==="pdf"){
            const buf = await f.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({data:buf}).promise;
            let full="";
            for(let i=1;i<=pdf.numPages;i++){
                $("status").textContent = `Leyendo página ${i} de ${pdf.numPages}...`;
                const page = await pdf.getPage(i);
                const c = await page.getTextContent();
                full += c.items.map(it=>it.str).join(" ") + "\n\n";
            }
            $("textEs").value = full;
            localStorage.setItem('sinteticos_es', full);
            $("status").textContent = "✅ PDF cargado";
        } else {
            const txt = await f.text();
            $("textEs").value = txt;
            localStorage.setItem('sinteticos_es', txt);
            $("status").textContent = "✅ Archivo cargado: " + txt.length + " caracteres";
        }
    }catch(err){
        $("status").textContent = "❌ Error: " + err.message;
    }
});

// MOTOR NUEVO - GOOGLE SIN LÍMITE
async function traducirGoogle(texto){
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=${encodeURIComponent(texto)}`;
    const r = await fetch(url);
    if(!r.ok) throw new Error("Fallo red");
    const j = await r.json();
    return j[0].map(x=>x[0]).join("");
}

async function traducir(){
    const es = $("textEs").value.trim();
    if(!es){ $("status").textContent = "Primero sube el archivo"; return; }
    $("status").textContent = "Traduciendo sin límite... no cierres";
    const enField = $("textEn");
    enField.value = "";
    let out = "";
    const TAM = 800;
    const bloques = [];
    for(let i=0;i<es.length;i+=TAM){ bloques.push(es.slice(i,i+TAM)); }
    
    for(let i=0;i<bloques.length;i++){
        $("status").textContent = `Traduciendo ${i+1} de ${bloques.length}...`;
        try{
            const trad = await traducirGoogle(bloques[i]);
            out += trad + " ";
            enField.value = out;
            localStorage.setItem('sinteticos_en', out); // Guarda cada bloque
            // Auto-backup cada 20 bloques
            if(i%20===0) localStorage.setItem('sinteticos_en_backup_'+i, m out);
        }catch(e){
            out += bloques[i] + " ";
            enField.value = out;
        }
        await new Promise(r=>setTimeout(r,250));
    }
    localStorage.setItem('sinteticos_en', out);
    $("status").textContent = "✅ Traducción completa. Dele a GUARDAR AVANCE";
}
</script>
</body>
</html>
