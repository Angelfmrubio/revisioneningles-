<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SINTÉTICOS - Revisor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:18px;line-height:1.55;background:#121212;color:#e0e0e0}
header{background:#0a1930;color:#ffd700;padding:20px 16px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:2px solid #ffd700}
header h1{margin:0;font-size:1.35rem;font-weight:700}
header p{margin:6px 0 0;font-size:.85rem;color:#a0a0a0}
main{padding:16px;max-width:780px;margin:0 auto}
label{display:block;margin:14px 0 6px;font-weight:700;color:#ffd700;font-size:.95rem}
textarea{width:100%;min-height:160px;padding:14px;font-size:17px;font-family:inherit;border:2px solid #333;border-radius:14px;background:#1e1e1e;color:#fff;resize:vertical}
.row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
button{flex:1;min-width:130px;min-height:56px;font-size:1rem;font-weight:700;border:none;border-radius:14px;cursor:pointer;padding:12px 14px}
button:active{transform:scale(.98)}
button.primary{background:#ffd700;color:#000}
button.secondary{background:#333;color:#fff}
button.listen{background:#1d7a3a;color:#fff}
button.translate{background:#2a5bd7;color:#fff}
.status{padding:14px;background:#1e3a5f;border-radius:14px;font-size:.95rem;margin:12px 0;text-align:center;display:none;color:#fff}
details{background:#1e1e1e;border-radius:14px;margin:12px 0;overflow:hidden;border:1px solid #333}
details summary{padding:16px;font-weight:700;font-size:1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#ffd700}
details summary::after{content:"▸";transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
details .body{padding:0 16px 16px;font-size:.95rem;color:#ccc}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:10px 0;border-bottom:1px solid #333}
.metric-row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.metric{flex:1;min-width:90px;background:#2a2a2a;border-radius:12px;padding:12px 6px;text-align:center}
.metric .v{font-size:1.35rem;font-weight:700;color:#ffd700}
.metric .l{font-size:.75rem;color:#888}
.tag-warn{color:#ff6b6b;font-weight:700}
.tag-ok{color:#51cf66;font-weight:700}
.empty{color:#888;font-style:italic}
</style>
</head>
<body>
<header>
<h1>📖 SINTÉTICOS - Revisor</h1>
<p>Español → Inglés · Dicta · Revisa · Escucha</p>
</header>
<main>
<label>📝 Español (original)</label>
<textarea id="textEs" placeholder="Pegue su capítulo de SINTÉTICOS en español aquí..."></textarea>
<div class="row">
<button class="secondary" id="dictEsBtn">🎤 Dictar ES</button>
<button class="translate" id="transBtn">🔄 Traducir ES → EN</button>
</div>

<div class="row">
<button class="secondary" id="uploadBtn" style="background:#6a1b9a; color:#fff; font-size:1.1rem; min-height:65px;">📁 SUBIR LIBRO (.EPUB, .TXT)</button>
<input type="file" id="fileInput" accept=".txt,.md,.html,.epub" style="display:none;">
</div>

<label>🇺🇸 Inglés (para revisar)</label>
<textarea id="text" placeholder="Aquí aparecerá el texto del libro o la traducción..."></textarea>
<div class="row">
<button class="secondary" id="dictEnBtn">🎤 Dictar EN</button>
<button class="primary" id="checkBtn">🔍 Revisar Capítulo EN</button>
</div>
<div class="row">
<button class="listen" id="listenBtn">🔊 Escuchar Diagnóstico</button>
<button class="secondary" id="clearBtn" style="flex:0.4;">🧹 Limpiar</button>
</div>
<div id="status" class="status"></div>
<div id="results"></div>
</main>
<script>
const TERMS={"entropy of being":["being's entropy","entropy of the being"],"chronopathy":["chronopatía","chronopaty","chronophaty"],"liquid connections":["liquid connection","connections liquid"],"zombie algorithms":["zombies algorithms","algorithm zombies"],"disruptive elite":["elite disruptiva","disruptive elites"],"negentropy":["negative entropy","negentropia"],"language of silence":["silence language","language of the silence"],"harmony of the imperfect":["harmony of imperfect","imperfect harmony"],"reactions taster":["catador de reacciones","reaction taster"],"hydration of the soul":["soul hydration","hydratation of the soul"],"wabi-sabi":["wabisabi"],"ikigai":["ikigay","ikigaii"],"half-lives":["half lives","halflives"]};
const CALQUES={"it is inevitable to elude":"it is impossible to avoid","to assemble with origins":"to reconnect with origins","the core issue is":"the main issue is","in order to":"to","due to the fact that":"because","it is important to note that":"(delete)","at the end of the day":"(cliché)","each time more":"increasingly","the same that":"the same as","depends of":"depends on","consists in":"consists of","in base to":"based on","with base in":"based on","it is for that":"that is why","for the contrary":"on the contrary"};
const $=id=>document.getElementById(id);
const splitSent=t=>{try{return t.split(/(?<=[.!?])\s+/).filter(s=>s.trim())}catch(e){return t.split(/[.!?]\s+/).filter(s=>s.trim())}};
function syl(w){w=w.toLowerCase().replace(/[^a-z]/g,'');if(!w)return 0;if(w.length<=3)return 1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');const m=w.match(/[aeiouy]{1,2}/g);return m?m.length:1}
function flesch(t){const ss=splitSent(t).length||1;const ws=t.split(/\s+/).filter(w=>w);const n=ws.length||1;let sy=0;for(const w of ws)sy+=syl(w);return 206.835-1.015*(n/ss)-84.6*(sy/n)}
function fkg(t){const ss=splitSent(t).length||1;const ws=t.split(/\s+/).filter(w=>w);const n=ws.length||1;let sy=0;for(const w of ws)sy+=syl(w);return 0.39*(n/ss)+11.8*(sy/n)-15.59}
function checkTerms(t){const low=t.toLowerCase(),out=[];for(const[c,w]of Object.entries(TERMS))for(const v of w)if(low.includes(v.toLowerCase()))out.push({c,w:v});return out}
function checkCalques(t){const low=t.toLowerCase(),out=[];for(const[k,v]of Object.entries(CALQUES))if(low.includes(k))out.push({k,v});return out}
function checkLong(t,max=28){return splitSent(t).map(s=>({n:s.split(/\s+/).length,s:s.trim()})).filter(o=>o.n>max).sort((a,b)=>b.n-a.n)}
function checkRepeats(t){const stop=new Set("that this with from have been they their there which while where what when will would could should about after before between into over under more most some such only also than then them".split(" "));const ws=t.toLowerCase().match(/\b[a-z]{4,}\b/g)||[];const c={};for(const w of ws)if(!stop.has(w))c[w]=(c[w]||0)+1;return Object.entries(c).filter(([,n])=>n>=4).sort((a,b)=>b[1]-a[1]).slice(0,15)}
function metricRow(vs){return `<div class="metric-row">${vs.map(v=>`<div class="metric"><div class="v">${v.v}</div><div class="l">${v.l}</div></div>`).join("")}</div>`}
function box(title,count,html,okText){const status=count===0?'<span class="tag-ok">✓</span>':`<span class="tag-warn">${count}</span>`;const body=count===0?`<p class="empty">${okText}</p>`:html;return `<details><summary>${title} ${status}</summary><div class="body">${body}</div></details>`}
let lastSpeech="";
function review(){const text=$("text").value.trim();const res=$("results"),st=$("status");if(!text){st.style.display="block";st.textContent="Pegue o suba texto en inglés.";return}const words=text.split(/\s+/).filter(w=>w).length;const sents=splitSent(text).length;const fre=flesch(text),fg=fkg(text);const terms=checkTerms(text);const cal=checkCalques(text);const long=checkLong(text);const rep=checkRepeats(text);let html=`<details open><summary>📊 Métricas</summary><div class="body">${metricRow([{v:words,l:"Palabras"},{v:sents,l:"Oraciones"},{v:sents?(words/sents).toFixed(1):0,l:"Pal/Ora"}])}${metricRow([{v:fre.toFixed(1),l:"Flesch"},{v:fg.toFixed(1),l:"Grado"}])}</div></details>`;html+=terms.length===0?box("🧩 Términos",0,"","Términos consistentes."):box("🧩 Términos",terms.length,`<ul class="plain">${terms.map(t=>`<li>Usa <strong>${t.c}</strong> en lugar de <em>${t.w}</em></li>`).join("")}</ul>`,"");html+=cal.length===0?box("🔁 Calcos",0,"","Sin calcos."):box("🔁 Calcos",cal.length,`<ul class="plain">${cal.map(c=>`<li>«${c.k}» → <strong>${c.v}</strong></li>`).join("")}</ul>`,"");html+=long.length===0?box("📏 Largas",0,"","Todas <28."):box("📏 Largas",long.length,`<ul class="plain">${long.map(o=>`<li><strong>${o.n} pal:</strong> ${o.s.slice(0,200)}</li>`).join("")}</ul>`,"");html+=rep.length===0?box("🔂 Repeticiones",0,"","Sin repeticiones."):box("🔂 Repeticiones",rep.length,`<ul class="plain">${rep.map(([w,n])=>`<li><strong>${w}</strong>: ${n}</li>`).join("")}</ul>`,"");res.innerHTML=html;lastSpeech=`Métricas ${words} palabras ${sents} oraciones Flesch ${fre.toFixed(1)} Grado ${fg.toFixed(1)} ${terms.length?`Términos ${terms.length}`:"Términos ok"} ${cal.length?`Calcos ${cal.length}`:"Sin calcos"} ${long.length?`Largas ${long.length}`:"Sin largas"} ${rep.length?`Repeticiones ${rep.length}`:"Sin repeticiones"}`;st.style.display="block";st.textContent="Revisión completada."}
function speak(){if(!lastSpeech){alert("Primero Revisar.");return}if(!("speechSynthesis"in window)){alert("No soporta voz.");return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastSpeech);u.lang="es-ES";u.rate=0.95;window.speechSynthesis.speak(u)}
async function traducir(){const es=$("textEs").value.trim();const st=$("status");const enField=$("text");if(!es){st.style.display="block";st.textContent="Escriba español primero.";return}st.style.display="block";st.textContent="Traduciendo ES→EN...";try{const chunks=[];let tmp=es;while(tmp.length>0){chunks.push(tmp.slice(0,450));tmp=tmp.slice(450)}let result="";for(const ch of chunks){const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(ch)}&langpair=es|en`;const r=await fetch(url);const j=await r.json();if(j.responseData&&j.responseData.translatedText)result+=j.responseData.translatedText+" ";else result+=ch+" "}enField.value=result.trim();st.textContent="Traducción lista. Pulse Revisar."}catch(e){st.textContent="Error traducción, verifique internet."}}
function dict(lang,target){return()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("No soportado");return}const rec=new SR();rec.lang=lang;rec.interimResults=false;rec.continuous=false;rec.onresult=e=>{const t=e.results[0][0].transcript;$(target).value+=($(target).value?" ":"")+t;$("status").style.display="block";$("status").textContent="Dictado añadido."};rec.onerror=e=>{$("status").style.display="block";$("status").textContent="Error: "+e.error};rec.start()}}
$("uploadBtn").addEventListener("click",()=>$("fileInput").click());
$("fileInput").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if(!f) return;
    const st = $("status");
    st.style.display = "block";
    st.textContent = "Cargando archivo...";
    if (f.name.toLowerCase().endsWith(".epub")) {
        try {
            const zip = await JSZip.loadAsync(f);
            let fullText = "";
            const promises = [];
            zip.forEach((relativePath, zipEntry) => {
                if (!zipEntry.dir && (relativePath.endsWith(".html") || relativePath.endsWith(".xhtml") || relativePath.endsWith(".htm"))) {
                    promises.push(zipEntry.async("string").then(content => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(content, "text/html");
                        fullText += (doc.body.textContent || doc.body.innerText || "") + "\n\n";
                    }));
                }
            });
            await Promise.all(promises);
            fullText = fullText.replace(/\n{3,}/g, '\n\n').trim();
            $("text").value = fullText;
            st.textContent = "¡Libro ePub extraído! Ahora puedes Revisar.";
        } catch (error) {
            st.textContent = "Error al abrir el ePub.";
        }
    } else {
        const r = new FileReader();
        r.onload = ev => {
            const txt = ev.target.result;
            if(/[áéíóúñ]/i.test(txt.slice(0,500))) $("textEs").value = txt;
            else $("text").value = txt;
            st.textContent = "Cargado: " + f.name;
        };
        r.readAsText(f);
    }
});
$("transBtn").addEventListener("click",traducir);
$("dictEsBtn").addEventListener("click",dict("es-ES","textEs"));
$("dictEnBtn").addEventListener("click",dict("en-US","text"));
$("checkBtn").addEventListener("click",review);
$("listenBtn").addEventListener("click",speak);
$("clearBtn").addEventListener("click",()=>{$("textEs").value="";$("text").value="";$("results").innerHTML="";$("status").style.display="none"});
</script>
</body>
</html>
