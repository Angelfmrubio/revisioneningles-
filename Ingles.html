<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SINTÉTICOS - Revisor KDP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:sans-serif;font-size:18px;background:#121212;color:#e0e0e0}
header{background:#0a1930;color:#ffd700;padding:20px;text-align:center;border-bottom:2px solid #ffd700;position:sticky;top:0;z-index:10}
main{padding:16px;max-width:780px;margin:0 auto}
label.titulo{display:block;margin:14px 0 6px;font-weight:700;color:#ffd700}
textarea{width:100%;min-height:160px;padding:14px;font-size:17px;border:2px solid #333;border-radius:14px;background:#1e1e1e;color:#fff;resize:vertical}
.row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
button{flex:1;min-height:56px;font-weight:700;border:none;border-radius:14px;cursor:pointer;padding:12px}
button.secondary{background:#333;color:#fff} button.primary{background:#ffd700;color:#000}
button.translate{background:#2a5bd7;color:#fff} button.book{background:#7c3aed;color:#fff;min-height:68px;font-size:1.1rem}
.status{padding:14px;background:#1e3a5f;border-radius:14px;margin:12px 0;display:none;text-align:center;color:#fff}
.status.ok{background:#1d7a3a}
.chip{border:1px solid #ffd700;color:#ffd700;border-radius:20px;padding:4px 10px;font-size:.8rem;margin:2px;display:inline-block}
select{width:100%;padding:14px;border-radius:12px;background:#2a2a2a;color:#ffd700;border:2px solid #ffd700;margin-bottom:10px;display:none}
.book-preview{border:2px dashed #ffd700;border-radius:14px;padding:16px;margin:12px 0;background:#1a1a1a;display:none}
.upload-label{display:block;background:#6a1b9a;color:#fff;font-size:1.1rem;min-height:65px;line-height:65px;text-align:center;border-radius:14px;font-weight:700;cursor:pointer}
.progress{height:12px;background:#333;border-radius:6px;margin:8px 0;overflow:hidden;display:none}
.progress-bar{height:100%;background:#ffd700;width:0%}
</style>
</head>
<body>
<header><h1>📖 SINTÉTICOS - Revisor KDP</h1><p>Recibe PDF completo · Divide en capítulos · Entrega libro Amazon</p></header>
<main>
<select id="chapterSelect"><option value="">-- Selecciona un capítulo --</option></select>
<label class="titulo">📝 Español (original)</label>
<textarea id="textEs" placeholder="Pegue capítulo o suba libro..."></textarea>
<div class="row"><button class="secondary" id="dictEsBtn">🎤 Dictar ES</button><button class="translate" id="transBtn">🔄 Traducir ES → EN</button></div>
<div class="row">
<label for="fileInput" class="upload-label">📁 SUBIR LIBRO COMPLETO</label>
<input type="file" id="fileInput" accept=".pdf,.epub,.docx,.txt,.html" style="display:none">
</div>
<div id="pdfControls" style="display:none"><div class="row"><button class="secondary" id="btn20">➡️ Siguientes 20 págs</button><button class="secondary" id="btnAll">📚 Acumular TODO</button></div><div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div><div id="acumuladoInfo"></div></div>
<label class="titulo">🇺🇸 Inglés (acumulado para maquetar)</label>
<textarea id="text" placeholder="Aquí se va acumulando el libro..."></textarea>
<div class="row"><button class="primary" id="checkBtn">🔍 Revisar EN</button></div>
<div class="row"><button class="book" id="maquetarBtn">📘 MAQUETAR PARA AMAZON KDP 6x9</button></div>
<div id="bookPreview" class="book-preview"><div id="previewContent"></div><div class="row"><button class="secondary" id="exportHtmlBtn">📥 Descargar HTML Kindle</button><button class="secondary" id="exportPdfBtn" style="background:#1d7a3a">📥 Descargar PDF 6x9</button></div></div>
<div id="status" class="status"></div><div id="results"></div>
<div class="row"><button class="secondary" id="clearBtn">🧹 Limpiar Todo</button></div>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
let pdfDoc=null,currentPage=0,totalPages=0,libroAcumulado="",bookChapters=[];
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const splitSent=t=>t.split(/[.!?]+\s+/).filter(s=>s.trim());

// DIVISOR INTELIGENTE - ARREGLADO PARA 7 PISADAS
function dividirEnCapitulos(fullText){
  // Normalizar saltos de línea
  fullText = fullText.replace(/\r/g,'\n');
  // Dividir por títulos en MAYÚSCULA de tu libro 7 PISADAS o por Capítulo
  let parts = fullText.split(/(?=^([A-ZÁÉÍÓÚÑ0-9\s\-\–—]{5,90})\n|Capítulo\s+\d+|CAPÍTULO\s+\d+|CAPITULO\s+\d+)/m);
  parts = parts.map(p=>p.trim()).filter(p=>p.length>150);
  
  let finalParts=[];
  parts.forEach(p=>{
    const words=p.split(/\s+/);
    if(words.length>4000){
      for(let i=0;i<words.length;i+=2000){
        finalParts.push(words.slice(i,i+2000).join(" "));
      }
    }else{ finalParts.push(p); }
  });
  if(finalParts.length<=1){
    const w=fullText.split(/\s+/);
    finalParts=[];
    for(let i=0;i<w.length;i+=2000) finalParts.push(w.slice(i,i+2000).join(" "));
  }
  bookChapters=finalParts;
  const sel=$("chapterSelect");
  sel.innerHTML='<option value="">-- Selecciona un capítulo --</option>';
  bookChapters.forEach((t,i)=>{
    let primeraLinea = t.split('\n').find(l=>l.trim().length>5) || `Capítulo ${i+1}`;
    primeraLinea = primeraLinea.trim().slice(0,45);
    const o=document.createElement("option");
    o.value=i;
    o.textContent=`${primeraLinea} (${t.split(/\s+/).length} pal)`;
    sel.appendChild(o);
  });
  sel.style.display="block";
  $("status").style.display="block";
  $("status").className="status ok";
  $("status").textContent=`¡Libro dividido en ${bookChapters.length} capítulos!`;
}

function loadChapter(){
  const i=$("chapterSelect").value;
  if(i==="") return;
  const txt=bookChapters[i];
  $("textEs").value=txt;
  $("status").style.display="block";
  $("status").textContent=`Capítulo ${parseInt(i)+1} cargado - ${txt.split(/\s+/).length} palabras`;
}
$("chapterSelect").addEventListener("change",loadChapter);

async function cargarPDFCompleto(file){
  const st=$("status"); st.style.display="block"; st.textContent="Cargando PDF...";
  try{
    const buf=await file.arrayBuffer();
    pdfDoc=await pdfjsLib.getDocument(buf).promise;
    totalPages=pdfDoc.numPages; currentPage=0;
    $("pdfControls").style.display="block";
    st.textContent=`PDF ${file.name} - ${totalPages} páginas. Pulse Siguientes 20.`;
    $("acumuladoInfo").innerHTML=`<span class="chip">0 / ${totalPages}</span>`;
  }catch(e){ st.textContent="Error PDF: "+e.message; }
}
async function extraerSiguientes(n=20){
  if(!pdfDoc) return;
  const st=$("status"); const bar=$("progressBar"); $("progress").style.display="block";
  let fin=Math.min(currentPage+n,totalPages); let texto="";
  for(let i=currentPage+1;i<=fin;i++){
    st.textContent=`Extrayendo página ${i} de ${totalPages}...`;
    bar.style.width=`${Math.round(i/totalPages*100)}%`;
    const page=await pdfDoc.getPage(i);
    const tc=await page.getTextContent();
    texto+=tc.items.map(it=>it.str).join(" ")+"\n\n";
  }
  currentPage=fin; libroAcumulado+=texto;
  $("text").value=libroAcumulado;
  dividirEnCapitulos(libroAcumulado);
  $("acumuladoInfo").innerHTML=`<span class="chip">${currentPage}/${totalPages} págs</span> <span class="chip">${libroAcumulado.split(/\s+/).length} pal</span>`;
  st.textContent=`Acumuladas ${currentPage}. Restan ${totalPages-currentPage}`;
  st.className="status ok";
}

function maquetarLibro(){
  const texto=$("text").value.trim()||libroAcumulado.trim();
  if(!texto){ alert("Acumule texto primero"); return; }
  let capitulos=texto.split(/(?=\b(CAP[ÍI]TULO|CHAPTER|Capítulo)\b|^[A-ZÁÉÍÓÚÑ\s]{5,90}$)/m);
  if(capitulos.length===1){
    const p=texto.split(/\s+/); capitulos=[];
    for(let i=0;i<p.length;i+=1800) capitulos.push(p.slice(i,i+1800).join(" "));
  }
  let htmlM=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>SINTÉTICOS</title><style>@page{size:6in 9in;margin-top:0.8in;margin-bottom:0.8in;margin-left:0.9in;margin-right:0.6in}body{font-family:'Georgia',serif;font-size:11pt;line-height:1.5;text-align:justify;max-width:700px;margin:0 auto;padding:40px 20px;color:#111}.portada{text-align:center;padding:80px 20px 40px;page-break-after:always}.portada h1{font-size:2.8rem;letter-spacing:.15em;font-weight:900}.portada h2{font-size:1.05rem;color:#555;margin-top:20px}.portada .autor{margin-top:60px;letter-spacing:.25em}.capitulo{page-break-before:always;margin-top:40px}.capitulo h2{font-size:1.4rem;text-transform:uppercase;letter-spacing:.1em;border-bottom:2px solid #000;padding-bottom:10px;text-align:left}.capitulo p{margin:0 0 1em;text-indent:1.5em;text-align:justify}.capitulo p:first-of-type{text-indent:0}.capitulo p:first-of-type::first-letter{font-size:3rem;float:left;line-height:.8;margin:6px 8px 0 0;font-weight:700}.indice{page-break-after:always}.indice ul{list-style:none;padding:0}.indice li{padding:6px 0;border-bottom:1px dotted #ccc}</style></head><body><div class="portada"><h1>SINTÉTICOS</h1><h2>ENTROPÍA, CONCIENCIA Y LA ARMONÍA DE LO IMPERFECTO</h2><div class="autor">ÁNGEL F. M. RUBIO</div><p style="margin-top:80px;font-size:.85rem;color:#888">Edición KDP 6x9</p></div><div class="indice"><h2>ÍNDICE</h2><ul>`;
  capitulos.forEach((c,i)=>{let tit=c.match(/^(CAP[ÍI]TULO|CHAPTER|Capítulo|[A-ZÁÉÍÓÚÑ\s]{5,60})/m);let t=tit?tit[0].slice(0,60):`Capítulo ${i+1}`;htmlM+=`<li>${esc(t)}</li>`;});
  htmlM+=`</ul></div>`;
  capitulos.forEach((c,i)=>{let tit=c.match(/^(CAP[ÍI]TULO|CHAPTER|Capítulo|[A-ZÁÉÍÓÚÑ\s]{5,80})/m);let titulo=tit?tit[0]:`Capítulo ${i+1}`;let cuerpo=tit?c.slice(titulo.length):c;const paras=cuerpo.split(/\n\n+/).map(p=>`<p>${esc(p.trim())}</p>`).join("");htmlM+=`<div class="capitulo"><h2>${esc(titulo)}</h2>${paras}</div>`;});
  htmlM+=`</body></html>`;
  window.libroMaquetadoHTML=htmlM;
  $("bookPreview").style.display="block";
  $("previewContent").innerHTML=`<p><span class="chip">${capitulos.length} capítulos</span> <span class="chip">${texto.split(/\s+/).length} palabras</span></p><p style="color:#ffd700">Listo para Amazon KDP</p>`;
  $("status").style.display="block"; $("status").className="status ok"; $("status").textContent=`¡Maquetado KDP! ${capitulos.length} capítulos.`;
}
function descargarHtml(){if(!window.libroMaquetadoHTML)return;const blob=new Blob([window.libroMaquetadoHTML],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="SINTETICOS-KDP-eBook.html";a.click();}
function descargarPdf(){if(!window.libroMaquetadoHTML)return;const w=window.open("","_blank");w.document.write(window.libroMaquetadoHTML);w.document.close();setTimeout(()=>w.print(),800);}

$("fileInput").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f)return; const ext=f.name.split(".").pop().toLowerCase(); const st=$("status"); st.style.display="block"; st.textContent="Extrayendo "+f.name+"...";
  try{
    if(ext==="pdf"){ await cargarPDFCompleto(f); }
    else { let txt=""; if(ext==="epub"){ const zip=await JSZip.loadAsync(f); const files=[]; zip.forEach((p,ent)=>{if(p.match(/\.x?html?$/))files.push({p,ent})}); for(let file of files){ const c=await file.ent.async("string"); const doc=new DOMParser().parseFromString(c,"text/html"); txt+=(doc.body.textContent||"")+"\n\n"; } } else if(ext==="docx"){ const buf=await f.arrayBuffer(); const r=await mammoth.extractRawText({arrayBuffer:buf}); txt=r.value; } else { txt=await f.text(); } libroAcumulado=txt; $("text").value=txt; dividirEnCapitulos(txt); }
  }catch(err){ st.textContent="Error: "+err.message; }
});
$("btn20").addEventListener("click",()=>extraerSiguientes(20));
$("btnAll").addEventListener("click",()=>extraerSiguientes(9999));
$("maquetarBtn").addEventListener("click",maquetarLibro);
$("exportHtmlBtn").addEventListener("click",descargarHtml);
$("exportPdfBtn").addEventListener("click",descargarPdf);
$("transBtn").addEventListener("click", async()=>{
  const es=$("textEs").value.trim(); if(!es){ $("status").style.display="block"; $("status").textContent="Cargue capítulo"; return; }
  const st=$("status"); st.style.display="block"; st.textContent="Traduciendo...";
  try{
    const chunks=[]; let temp=es; while(temp.length>0){ chunks.push(temp.slice(0,430)); temp=temp.slice(430); }
    let out=""; for(let ch of chunks){ const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(ch)}&langpair=es|en`; const r=await fetch(url); const j=await r.json(); out+=(j.responseData?.translatedText||ch)+" "; await new Promise(r=>setTimeout(r,400)); }
    $("text").value=out; st.textContent="Traducción lista"; st.className="status ok";
  }catch(e){ st.textContent="Error traducción"; }
});
$("checkBtn").addEventListener("click",()=>{
  const t=$("text").value.trim(); if(!t) return; const w=t.split(/\s+/).length; $("results").innerHTML=`<div style="background:#1e1e1e;padding:12px;border-radius:10px;margin-top:10px"><p>Palabras: ${w}</p><p>Flesch: ${(206.835-1.015*(w/(splitSent(t).length||1))-84.6*1.4).toFixed(1)}</p></div>`; $("status").style.display="block"; $("status").textContent="Revisión básica OK";
});
$("clearBtn").addEventListener("click",()=>{ if(confirm("¿Borrar todo?")){ libroAcumulado=""; pdfDoc=null; currentPage=0; totalPages=0; bookChapters=[]; $("textEs").value=""; $("text").value=""; $("results").innerHTML=""; $("status").style.display="none"; $("pdfControls").style.display="none"; $("bookPreview").style.display="none"; $("chapterSelect").style.display="none"; }});
</script>
</body>
</html>
