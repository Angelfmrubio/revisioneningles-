<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINTÉTICOS - Lector Word</title>
<!-- Solo la librería para leer Word -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
h1 { color: #ffd700; font-size: 1.5rem; }
/* ESTE ES EL BOTÓN NATIVO REAL, EL QUE ABRE LOS ARCHIVOS EN EL TELÉFONO */
input[type="file"] {
    display: block;
    width: 100%;
    padding: 30px;
    background: #6a1b9a;
    color: white;
    font-size: 1.2rem;
    font-weight: bold;
    border: 3px dashed #ffd700;
    border-radius: 12px;
    margin: 20px 0;
    cursor: pointer;
}
textarea {
    width: 100%;
    height: 300px;
    padding: 10px;
    background: #1e1e1e;
    color: #fff;
    border: 2px solid #333;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 20px;
}
.status { font-weight: bold; color: #ffd700; margin: 10px 0; font-size: 1.1rem; }
</style>
</head>
<body>

<h1>📖 Lector de Word</h1>

<!-- Al tocar este botón, se abre el explorador de archivos del teléfono -->
<input type="file" id="fileInput" accept=".docx" onchange="leerWord()">

<div class="status" id="status">Esperando tu archivo Word...</div>

<textarea id="texto" placeholder="El texto de tu libro aparecerá aquí..."></textarea>

<script>
function leerWord() {
    const file = document.getElementById('fileInput').files[0];
    const status = document.getElementById('status');
    const texto = document.getElementById('texto');

    if (!file) {
        status.innerText = "No seleccionaste ningún archivo.";
        return;
    }

    status.innerText = "Leyendo archivo... por favor espera.";

    // El teléfono lee el archivo
    const reader = new FileReader();
    
    reader.onload = function(e) {
        const arrayBuffer = e.target.result;
        
        // Mammoth extrae el texto
        mammoth.extractRawText({arrayBuffer: arrayBuffer})
            .then(function(result) {
                texto.value = result.value;
                status.innerText = "✅ ¡Libro cargado con éxito!";
            })
            .catch(function(err) {
                status.innerText = "❌ Error al leer el archivo. Asegúrate de que sea .docx";
                console.error(err);
            });
    };
    
    reader.onerror = function() {
        status.innerText = "❌ Error al abrir el archivo en el teléfono.";
    };

    // Iniciar lectura
    reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
